<!DOCTYPE html>
<html lang="uk" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Аналітична панель: Промокоди та Видачі</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: { 500: '#6366f1', 600: '#4f46e5' }
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen font-sans p-4 md:p-8">

    <div class="max-w-7xl mx-auto space-y-6">
        <!-- Header -->
        <header class="flex flex-col md:flex-row md:items-center justify-between gap-4 bg-slate-900 p-6 rounded-2xl border border-slate-800 shadow-xl">
            <div>
                <h1 class="text-2xl font-bold tracking-tight text-white">Аналітична панель: Промокоди та Видачі (Live Sheets)</h1>
                <p class="text-slate-400 text-sm mt-1">Динамічне оновлення даних у реальному часі з Google Таблиці</p>
            </div>
            <div class="flex items-center gap-3">
                <span id="statusBadge" class="inline-flex items-center gap-2 px-3 py-1.5 rounded-full text-xs font-medium bg-slate-800 text-slate-400 border border-slate-700">
                    <span id="statusDot" class="w-2 h-2 rounded-full bg-slate-500"></span>
                    <span id="statusText">Завантаження даних...</span>
                </span>
                <button onclick="fetchData()" class="px-4 py-1.5 bg-indigo-600 hover:bg-indigo-500 text-white text-sm font-medium rounded-lg transition-all shadow-md">
                    🔄 Оновити зараз
                </button>
            </div>
        </header>

        <!-- Dynamic Summary Cards -->
        <div id="summaryCards" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4"></div>

        <!-- Filters Section -->
        <div class="bg-slate-900 p-5 rounded-2xl border border-slate-800 shadow-xl space-y-3">
            <div class="flex items-center justify-between">
                <h2 class="text-sm font-semibold uppercase tracking-wider text-slate-400">Фільтр каналів:</h2>
                <button onclick="toggleAllChannels()" class="text-xs text-indigo-400 hover:text-indigo-300 font-medium">Вибрати всі / Скинути</button>
            </div>
            <div id="channelFilters" class="flex flex-wrap gap-2"></div>
        </div>

        <!-- Charts Grid -->
        <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
            <div class="bg-slate-900 p-6 rounded-2xl border border-slate-800 shadow-xl space-y-4">
                <h2 class="text-base font-semibold text-white">1. Динаміка середньої знижки (%) по каналах</h2>
                <div class="relative min-h-[320px]">
                    <canvas id="discountChart"></canvas>
                </div>
            </div>

            <div class="bg-slate-900 p-6 rounded-2xl border border-slate-800 shadow-xl space-y-4">
                <h2 class="text-base font-semibold text-white">2. Кількість видач по каналах (шт.)</h2>
                <div class="relative min-h-[320px]">
                    <canvas id="volumeChart"></canvas>
                </div>
            </div>

            <div class="bg-slate-900 p-6 rounded-2xl border border-slate-800 shadow-xl space-y-4 lg:col-span-2">
                <h2 class="text-base font-semibold text-white">3. Частка видач по каналах (%)</h2>
                <div class="relative min-h-[320px]">
                    <canvas id="shareChart"></canvas>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Посилання на опублікований CSV
        const GOOGLE_SHEET_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSZk6CZxyj5wN8FFKLl95y5fGH8aAR63IY4OGaxpf4D6-ztZZsnmSSLyjVQGSn_UmLL1ostR9L-VNlq/pub?output=csv';

        let rawData = [];
        let months = [];
        let overallDiscount = [];
        let channelData = {};
        let activeChannels = new Set();
        let charts = {};

        const channelColors = {
            'SMS': '#3b82f6',
            'PersonalAc': '#10b981',
            'Telesale': '#f59e0b',
            'App Push': '#8b5cf6',
            'Web Push': '#ec4899',
            'Email': '#06b6d4',
            'WA': '#84cc16'
        };

        async function fetchData() {
            updateStatus('loading', 'Оновлення...');
            Papa.parse(GOOGLE_SHEET_URL, {
                download: true,
                header: true,
                skipEmptyLines: true,
                complete: function(results) {
                    if (results.data && results.data.length > 0) {
                        rawData = results.data;
                        processRawData(rawData);
                        updateStatus('live', `Live (Оновлено ${new Date().toLocaleTimeString()})`);
                    } else {
                        updateStatus('error', 'Помилка даних');
                    }
                },
                error: function(err) {
                    console.error('PapaParse error:', err);
                    updateStatus('error', 'Помилка мережі');
                }
            });
        }

        function processRawData(rows) {
            months = [];
            overallDiscount = [];
            channelData = {};
            const monthTotals = {};
            let currentMonth = '';
            let currentOverall = 0;

            rows.forEach(row => {
                let month = (row['Місяць'] || row['Month'] || '').trim();
                if (month) {
                    currentMonth = month;
                } else {
                    month = currentMonth;
                }

                const channel = (row['Канал'] || row['Channel'] || '').trim();

                const volumeVal = row['К-сть видач'] || row['Volume'] || 0;
                const volume = parseFloat(String(volumeVal).replace(/\s/g, '').replace(',', '.')) || 0;

                const discountVal = row['Середня знижка %'] || row['Discount'] || 0;
                const discount = parseFloat(String(discountVal).replace('%', '').replace(',', '.')) || 0;

                const shareVal = row['Частка %'] || row['Share'] || 0;
                const share = parseFloat(String(shareVal).replace('%', '').replace(',', '.')) || 0;

                const monthOverallVal = row['Загальна знижка бізнесу %'] || row['OverallDiscount'] || 0;
                const parsedOverall = parseFloat(String(monthOverallVal).replace('%', '').replace(',', '.'));
                if (!isNaN(parsedOverall) && parsedOverall > 0) {
                    currentOverall = parsedOverall;
                }

                if (!month || !channel) return;

                if (!months.includes(month)) {
                    months.push(month);
                    overallDiscount.push(currentOverall);
                    monthTotals[month] = 0;
                }

                monthTotals[month] += volume;

                if (!channelData[channel]) {
                    channelData[channel] = { volume: [], share: [], discount: [] };
                    if (!channelColors[channel]) {
                        channelColors[channel] = '#' + Math.floor(Math.random()*16777215).toString(16);
                    }
                }

                channelData[channel].volume.push(volume);
                channelData[channel].share.push(share);
                channelData[channel].discount.push(discount);
            });

            if (activeChannels.size === 0) {
                Object.keys(channelData).forEach(ch => activeChannels.add(ch));
            }

            renderMetrics(monthTotals);
            initFilters();
            renderOrUpdateCharts();
        }

        function renderMetrics(monthTotals) {
            const container = document.getElementById('summaryCards');
            container.innerHTML = '';
            months.forEach((m, idx) => {
                const totalVol = monthTotals[m] || 0;
                const targetDiscount = overallDiscount[idx] || 0;
                const card = document.createElement('div');
                card.className = 'bg-slate-900 p-5 rounded-2xl border border-slate-800 shadow-xl flex flex-col justify-between';
                card.innerHTML = `
                    <div class="flex items-center justify-between">
                        <span class="text-xs font-semibold uppercase tracking-wider text-slate-400">${m}</span>
                        <span class="text-xs px-2 py-0.5 rounded bg-indigo-500/10 text-indigo-400 font-medium border border-indigo-500/20">Ціль: ${targetDiscount}%</span>
                    </div>
                    <div class="mt-4">
                        <div class="text-2xl font-bold text-white">${totalVol.toLocaleString()} <span class="text-xs font-normal text-slate-400">шт.</span></div>
                        <div class="text-xs text-slate-400 mt-1">Всього видач за місяць</div>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function initFilters() {
            const container = document.getElementById('channelFilters');
            container.innerHTML = '';
            Object.keys(channelData).forEach(ch => {
                const isActive = activeChannels.has(ch);
                const btn = document.createElement('button');
                btn.onclick = () => toggleChannel(ch);
                btn.className = `px-3 py-1.5 rounded-lg text-xs font-medium transition-all flex items-center gap-2 border ${
                    isActive 
                    ? 'bg-slate-800 text-white border-slate-600 shadow' 
                    : 'bg-slate-950 text-slate-500 border-slate-800 hover:border-slate-700'
                }`;
                btn.innerHTML = `
                    <span class="w-2.5 h-2.5 rounded-full" style="background-color: ${channelColors[ch] || '#ccc'}"></span>
                    ${ch}
                `;
                container.appendChild(btn);
            });
        }

        function toggleChannel(ch) {
            if (activeChannels.has(ch)) {
                if (activeChannels.size > 1) activeChannels.delete(ch);
            } else {
                activeChannels.add(ch);
            }
            initFilters();
            renderOrUpdateCharts();
        }

        function toggleAllChannels() {
            const all = Object.keys(channelData);
            if (activeChannels.size === all.length) {
                activeChannels = new Set([all[0]]);
            } else {
                activeChannels = new Set(all);
            }
            initFilters();
            renderOrUpdateCharts();
        }

        function renderOrUpdateCharts() {
            const discountDatasets = [];
            const volumeDatasets = [];
            const shareDatasets = [];

            // Лінія загальної знижки бізнесу
            discountDatasets.push({
                label: 'Загальна знижка бізнесу',
                data: overallDiscount,
                borderColor: '#ef4444',
                borderWidth: 2,
                borderDash: [5, 5],
                fill: false,
                pointRadius: 3
            });

            activeChannels.forEach(ch => {
                const data = channelData[ch];
                const color = channelColors[ch] || '#888';

                discountDatasets.push({
                    label: ch,
                    data: data.discount,
                    borderColor: color,
                    backgroundColor: color,
                    tension: 0.3,
                    fill: false
                });

                volumeDatasets.push({
                    label: ch,
                    data: data.volume,
                    backgroundColor: color,
                    borderRadius: 4
                });

                shareDatasets.push({
                    label: ch,
                    data: data.share,
                    borderColor: color,
                    backgroundColor: color,
                    tension: 0.3,
                    fill: false
                });
            });

            createChart('discountChart', 'line', months, discountDatasets, { ySuffix: '%' });
            createChart('volumeChart', 'bar', months, volumeDatasets, { stacked: false });
            createChart('shareChart', 'line', months, shareDatasets, { ySuffix: '%' });
        }

        function createChart(canvasId, type, labels, datasets, options = {}) {
            if (charts[canvasId]) {
                charts[canvasId].destroy();
            }
            const ctx = document.getElementById(canvasId).getContext('2d');
            charts[canvasId] = new Chart(ctx, {
                type: type,
                data: { labels, datasets },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: { labels: { color: '#94a3b8', font: { size: 12 } } },
                        tooltip: {
                            callbacks: {
                                label: function(context) {
                                    let label = context.dataset.label || '';
                                    if (label) label += ': ';
                                    if (context.parsed.y !== null) {
                                        label += context.parsed.y + (options.ySuffix || '');
                                    }
                                    return label;
                                }
                            }
                        }
                    },
                    scales: {
                        x: { grid: { color: '#1e293b' }, ticks: { color: '#94a3b8' } },
                        y: {
                            grid: { color: '#1e293b' },
                            ticks: {
                                color: '#94a3b8',
                                callback: value => value + (options.ySuffix || '')
                            }
                        }
                    }
                }
            });
        }

        function updateStatus(type, text) {
            const badge = document.getElementById('statusBadge');
            const dot = document.getElementById('statusDot');
            const label = document.getElementById('statusText');
            label.innerText = text;

            if (type === 'live') {
                dot.className = 'w-2 h-2 rounded-full bg-emerald-500 animate-pulse';
                badge.className = 'inline-flex items-center gap-2 px-3 py-1.5 rounded-full text-xs font-medium bg-emerald-500/10 text-emerald-400 border border-emerald-500/20';
            } else if (type === 'loading') {
                dot.className = 'w-2 h-2 rounded-full bg-amber-500 animate-ping';
                badge.className = 'inline-flex items-center gap-2 px-3 py-1.5 rounded-full text-xs font-medium bg-amber-500/10 text-amber-400 border border-amber-500/20';
            } else {
                dot.className = 'w-2 h-2 rounded-full bg-rose-500';
                badge.className = 'inline-flex items-center gap-2 px-3 py-1.5 rounded-full text-xs font-medium bg-rose-500/10 text-rose-400 border border-rose-500/20';
            }
        }

        // Запуск при завантаженні сторінки
        fetchData();
        // Автооновлення кожні 2 хвилини
        setInterval(fetchData, 120000);
    </script>
</body>
</html>
